<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3ec;--bg2:#e6dcff;--ink:#5a1f3d;--soft:#94506f;--rose:#ff5c8a;--rose2:#e8316b;--paper:#fffaf6;--gold:#f4bd4f;--shadow:rgba(232,49,107,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b1033;--bg2:#171039;--ink:#ffe3ee;--soft:#e9b6cd;--paper:#3a1b45;--shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg1:#2b1033;--bg2:#171039;--ink:#ffe3ee;--soft:#e9b6cd;--paper:#3a1b45;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{height:100vh;height:100dvh}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden;display:grid;place-items:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
#hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#hearts span{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.7}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
main{position:relative;z-index:2;width:100%;height:100%;display:grid;place-items:center;padding:18px 14px}
#intro{text-align:center;transition:opacity .7s,transform .7s}
#intro.leave{opacity:0;transform:scale(1.25);pointer-events:none}
.hint{font-family:'Caveat',cursive;font-size:clamp(28px,7vw,40px);margin:0 0 28px}
.tap{margin:34px 0 0;color:var(--soft);animation:pulse 1.6s ease-in-out infinite;transition:opacity .4s}
.opened .tap{opacity:0}
@keyframes pulse{50%{opacity:.35;transform:scale(.97)}}
/* envelope */
.env{--w:min(320px,78vw);position:relative;width:var(--w);height:calc(var(--w)*.68);margin:0 auto;cursor:pointer;animation:float 3.4s ease-in-out infinite;filter:drop-shadow(0 18px 24px var(--shadow))}
.opened .env{animation:none;cursor:default}
@keyframes float{50%{transform:translateY(-10px) rotate(-1deg)}}
.env>*{position:absolute}
.back{inset:0;background:#f06a93;border-radius:10px;z-index:1}
.paper{left:6%;right:6%;top:7%;height:82%;background:var(--paper);border-radius:6px;z-index:2;display:grid;place-items:center;font-family:'Caveat',cursive;font-size:28px;color:var(--rose2);transition:transform .9s cubic-bezier(.3,1.2,.5,1) .6s}
.front{inset:0;z-index:3;border-radius:10px;background:linear-gradient(180deg,#ff8fb0,#ff6b97);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.flap{left:0;top:0;width:100%;height:calc(var(--w)*.4);z-index:4;background:linear-gradient(180deg,#ff7aa2,#e8467a);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease,z-index 0s .35s}
.seal{left:50%;top:calc(var(--w)*.4 - 22px);width:44px;height:44px;margin-left:-22px;z-index:5;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd978,var(--gold));display:grid;place-items:center;color:#c0204f;font-size:22px;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .45s,opacity .45s}
.open .seal{transform:scale(1.8);opacity:0}
.open .flap{transform:rotateX(180deg);z-index:1}
.open .paper{transform:translateY(calc(var(--w)*-.4))}
/* card */
#card{display:none;flex-direction:column;align-items:center;gap:14px;width:100%;height:100%;max-height:760px;padding-top:12px}
#card.show{display:flex}
.card{position:relative;width:min(440px,100%);flex:1;min-height:0;max-height:620px;background:var(--paper);border-radius:28px;box-shadow:0 24px 50px var(--shadow);border:3px dashed color-mix(in srgb,var(--rose) 45%,transparent);animation:land .9s cubic-bezier(.2,1.3,.4,1)}
@keyframes land{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.card:before,.card:after{content:"";position:absolute;top:-12px;width:70px;height:24px;background:rgba(244,189,79,.65);border-radius:3px}
.card:before{left:26px;transform:rotate(-8deg)}.card:after{right:26px;transform:rotate(7deg)}
.slide{overflow-y:auto;position:absolute;inset:0;padding:34px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s}
.slide.on{opacity:1;visibility:visible}
.slide h1,.slide h2{font-family:'Caveat',cursive;margin:0;line-height:1}
h1{font-size:clamp(46px,13vw,72px);color:var(--rose2);text-wrap:balance;margin:6px 0 12px!important}
.tag{font-family:'Caveat',cursive;font-size:clamp(26px,7vw,34px);line-height:1.15;margin:0;color:var(--soft);text-wrap:balance}
@media (max-width:480px){
main{padding:12px 10px}
.card{border-radius:24px}
.slide{padding:28px 18px}
.cake{font-size:52px}
button{padding:12px 22px;font-size:17px}
.btns{gap:12px}
.wishes{gap:12px}
.nav{min-height:84px;gap:10px}
.hint{margin-bottom:22px}
}
@media (max-height:640px){.cake{font-size:44px}.hint{margin-bottom:14px}.nav{min-height:70px}}
h2{font-size:clamp(46px,12vw,66px);color:var(--rose2)}
.name{font-family:'Caveat',cursive;font-size:clamp(34px,9vw,48px);margin:6px 0 14px}
.cake{font-size:64px;display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.date{color:var(--soft);margin:8px 0 0}
.wishes{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:16px;font-size:clamp(18px,4.8vw,22px)}
.wishes li{opacity:0}
.on .wishes li{animation:in .7s both;animation-delay:calc(var(--i)*.55s + .3s)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.letter{justify-content:flex-start;align-items:stretch;overflow-y:auto;text-align:left;border-radius:25px;--m:42px;padding:34px 18px 34px calc(var(--m) + 14px);
background-color:var(--paper);
background-image:linear-gradient(90deg,transparent var(--m),color-mix(in srgb,var(--rose2) 55%,transparent) var(--m),color-mix(in srgb,var(--rose2) 55%,transparent) calc(var(--m) + 2px),transparent calc(var(--m) + 2px)),linear-gradient(transparent 33px,color-mix(in srgb,var(--rose) 28%,transparent) 33px);
background-size:100% 100%,100% 34px;background-attachment:local,local;background-repeat:no-repeat,repeat}
.letter>*{flex:none}
.letter h3{font-family:'Caveat',cursive;font-size:36px;line-height:34px;margin:0 0 34px;color:var(--rose2)}
.letter p{font-family:'Caveat',cursive;font-size:clamp(22px,5.6vw,27px);line-height:34px;white-space:pre-line;margin:0}
.letter blockquote{margin:34px 0;padding:0;text-align:center;font-family:'Caveat',cursive;font-style:italic;font-weight:700;font-size:clamp(23px,6vw,29px);line-height:34px;color:var(--rose2);white-space:pre-line}
.ask p{font-size:clamp(22px,6vw,28px);margin:14px 0 26px;color:var(--soft)}
.beat{display:inline-block;animation:beat 1.1s infinite}
@keyframes beat{15%{transform:scale(1.3)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
.btns{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:70px}
button{font:inherit;font-weight:600;border:0;cursor:pointer;border-radius:999px;padding:14px 28px;font-size:19px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.yes{background:linear-gradient(135deg,#ff6b97,var(--rose2));color:#fff;box-shadow:0 8px 20px var(--shadow);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.yes:hover{filter:brightness(1.08)}
.no{background:#fff;color:var(--soft);border:2px solid color-mix(in srgb,var(--rose) 50%,transparent)}
.no.fly{position:fixed;z-index:60;transition:left .28s cubic-bezier(.3,1.6,.5,1),top .28s cubic-bezier(.3,1.6,.5,1)}
.done{display:none}.won .done{display:block;animation:in .9s both}.won .q{display:none}
.nav{flex:none;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:92px}
.next{background:var(--rose2);color:#fff;box-shadow:0 8px 18px var(--shadow)}
.next:hover{transform:translateY(-2px)}
.dots{display:flex;gap:8px}.dots i{width:9px;height:9px;border-radius:50%;background:color-mix(in srgb,var(--rose) 30%,transparent);transition:.3s}.dots i.on{background:var(--rose2);transform:scale(1.35)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-width:480px){.slide{padding:26px 16px}.letter{--m:30px;padding:34px 12px 34px calc(var(--m) + 12px)}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="hearts"></div>
<main>
  <section id="intro">
    <p class="hint">Somebody left you a letter…</p>
    <div class="env" id="env" role="button" tabindex="0" aria-label="Open the envelope">
      <div class="back"></div>
      <div class="paper">for you 💌</div>
      <div class="front"></div>
      <div class="flap"></div>
      <div class="seal">♥</div>
    </div>
    <p class="tap">tap the envelope</p>
  </section>

  <section id="card">
    <div class="card">
      <div class="slide"><span class="cake">🎂</span><h1>Happy Birthday Meri Jaan</h1><p class="tag">meri choti si pink marshmallow with caramel 🍬</p></div>
      <div class="slide"><h2>Wishing you…</h2><ul class="wishes" id="wishes"></ul></div>
      <div class="slide letter"><h3 id="dear"></h3><p id="letterText"></p><blockquote id="poem"></blockquote><p id="letterEnd"></p></div>
      <div class="slide ask">
        <div class="q">
          <h2>I love you meri jaan <span class="beat">❤️</span></h2>
          <p>do you love me too?</p>
          <div class="btns"><button class="yes" id="yes">Yes baby</button><button class="no" id="no">No</button></div>
        </div>
        <div class="done"><h2>Yayyy! 🥳💖</h2><p id="doneText"></p></div>
      </div>
    </div>
    <div class="nav"><button class="next" id="next"></button><div class="dots" id="dots"></div></div>
  </section>
</main>

<script>
/* ============================================================
   ✏️  EDIT ONLY THIS BLOCK  ✏️
   ============================================================ */
const HER_NAME = "Meri Jaan";        // her name / nickname
const MY_NAME  = "Nussiee";             // signs off at the end

const WISHES = [                     // short birthday wishes (add or remove lines)
  "May your day be as sweet as your smile 🍰",
  "May every dream you carry come true ✨",
  "May you always feel as loved as you deserve 💖",
  "May this year bring you endless laughter 🌸"
];

// 👇👇 YOUR LETTER (don't use the ` character inside) 👇👇
const LETTER_TOP = `3 October mere liye sirf tumhari birthday nahi, balkay woh din hai jis din meri duniya mein woh insan aaya jo aaj meri duniya ban chuka hai. ❤️

Tum meri zindagi ka woh khoobsurat hissa ho jise main kabhi khona nahi chahta. Tumhari smile mera sukoon hai, tumhari khushi meri dua, aur tumhara saath meri sabse khoobsurat feeling hai. 🥺❤️`;

const POEM = `"Na jaane kis dua ka asar ho tum,
Meri har khushi ka sabab ho tum.
Tumhein dekhoon toh dil ko sukoon milta hai,
Meri mohabbat hi nahi… meri aadat ho tum." ❤️`;

const LETTER_END = `Happy Birthday meri jaan. 🎂❤️

Allah tumhein hamesha khush rakhe, aur mujhe hamesha tumhari muskurahat ki wajah banaye.
I love you, more than words can ever explain. ❤️`;
// 👆👆 END OF YOUR LETTER 👆👆
/* ============================================================ */

const $ = id => document.getElementById(id);
const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
$('dear').textContent = HER_NAME + ' ❤️';
$('letterText').textContent = LETTER_TOP;
$('poem').textContent = POEM;
$('letterEnd').textContent = LETTER_END;
$('doneText').textContent = 'Happy Birthday, ' + HER_NAME + '. Forever yours, ' + MY_NAME + ' 💕';
$('wishes').innerHTML = WISHES.map((w, i) => `<li style="--i:${i}"></li>`).join('');
[...$('wishes').children].forEach((li, i) => li.textContent = WISHES[i]);

/* floating background hearts */
if (!still) {
  const em = ['💗', '💖', '🌸', '✨', '🎀', '🤍'];
  for (let k = 0; k < 18; k++) {
    const s = document.createElement('span');
    s.textContent = em[k % em.length];
    s.style.cssText = `left:${Math.random() * 100}%;font-size:${14 + Math.random() * 22}px;animation-duration:${9 + Math.random() * 10}s;animation-delay:${-Math.random() * 14}s`;
    $('hearts').appendChild(s);
  }
}

/* confetti of emoji */
const cv = $('fx'), ctx = cv.getContext('2d');
let P = [], running = false, dpr = Math.min(devicePixelRatio || 1, 2);
function size() { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
addEventListener('resize', size); size();
const bits = ['💖', '💗', '🎀', '✨', '🌸', '🎉', '💕'];
function burst(x, y, n = 70) {
  if (still) return;
  for (let i = 0; i < n; i++) P.push({ x, y, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 3, s: 14 + Math.random() * 16, r: 0, vr: (Math.random() - .5) * .3, e: bits[i % bits.length] });
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  P = P.filter(p => p.y < innerHeight + 40);
  for (const p of P) {
    p.vy += .26; p.vx *= .995; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.font = p.s + 'px serif'; ctx.fillText(p.e, -p.s / 2, p.s / 2); ctx.restore();
  }
  if (P.length) requestAnimationFrame(tick); else running = false;
}

/* envelope opening */
let opened = false;
function openEnv() {
  if (opened) return; opened = true;
  $('intro').classList.add('opened');
  $('env').classList.add('open');
  setTimeout(() => burst(innerWidth / 2, innerHeight / 2, 40), 500);
  setTimeout(() => $('intro').classList.add('leave'), 2400);
  setTimeout(() => { $('intro').style.display = 'none'; $('card').classList.add('show'); show(0); burst(innerWidth / 2, innerHeight / 2, 80); }, 3100);
}
$('env').addEventListener('click', openEnv);
$('env').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openEnv(); });

/* slides */
const slides = [...document.querySelectorAll('.slide')];
const labels = ['Open my wishes 🎁', 'Keep reading 💌', 'One last thing… 🥺'];
$('dots').innerHTML = slides.map(() => '<i></i>').join('');
let cur = 0;
function show(n) {
  cur = n;
  slides.forEach((s, k) => s.classList.toggle('on', k === n));
  [...$('dots').children].forEach((d, k) => d.classList.toggle('on', k === n));
  $('next').style.display = n === slides.length - 1 ? 'none' : '';
  $('next').textContent = labels[n] || 'Next';
  if (n === 1) burst(innerWidth / 2, innerHeight * .6, 30);
}
$('next').addEventListener('click', () => show(Math.min(cur + 1, slides.length - 1)));

/* the shy "No" button */
const no = $('no'), yes = $('yes');
const noText = ['No', 'Are you sure? 🥺', 'Nope 🙈', 'Try again 😜', "Can't catch me!", 'Aww, really? 💔', 'Just say yes 😘'];
let moved = false, dodges = 0;
function dodge(e) {
  if (e && e.cancelable) e.preventDefault();
  if (!moved) {
    const r = no.getBoundingClientRect();
    document.body.appendChild(no);
    no.classList.add('fly');
    no.style.left = r.left + 'px'; no.style.top = r.top + 'px';
    no.offsetWidth; moved = true;
  }
  dodges++;
  no.textContent = noText[dodges % noText.length];
  const w = no.offsetWidth, h = no.offsetHeight, pad = 12, y = yes.getBoundingClientRect();
  let x, t, k = 0;
  do {
    x = pad + Math.random() * (innerWidth - w - pad * 2);
    t = pad + Math.random() * (innerHeight - h - pad * 2);
    k++;
  } while (k < 40 && Math.abs(x + w / 2 - (y.left + y.width / 2)) < (y.width + w) / 2 + 30 && Math.abs(t + h / 2 - (y.top + y.height / 2)) < (y.height + h) / 2 + 30);
  no.style.left = x + 'px'; no.style.top = t + 'px';
  yes.style.transform = 'scale(' + Math.min(1 + dodges * .07, 1.5) + ')';
}
['pointerenter', 'pointerdown', 'touchstart', 'focus', 'click'].forEach(ev => no.addEventListener(ev, dodge, { passive: false }));

/* the big yes */
yes.addEventListener('click', () => {
  no.remove();
  document.querySelector('.ask').classList.add('won');
  const r = yes.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top, 120);
  let n = 0;
  const iv = setInterval(() => { burst(Math.random() * innerWidth, innerHeight * .2, 25); if (++n > 8) clearInterval(iv); }, 450);
});
</script>
</body>
</html>
